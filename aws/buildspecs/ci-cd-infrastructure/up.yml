version: 0.2

env:
  variables:
    TS_TERRAFORM_BIN: "terraform"
    TS_VERSION_CHECK: "0"

phases:
  install:
    runtime-versions:
      python: $PYTHON_VERSION
      ruby: $RUBY_VERSION
    commands:
      - "echo ## Install Terraspace"
      - ". ${CODEBUILD_SRC_DIR}/${SCRIPT_DIR}/sh/credentials.sh"
      - "dnf install -y yum-utils"
      - ". ${CODEBUILD_SRC_DIR}/${SCRIPT_DIR}/sh/terraform_installation.sh"
      - "dnf update -y"
  build:
    commands:
      - "cd ${CODEBUILD_SRC_DIR}"
      - "echo ## TERRASPACE Init : Initialize CI/CD infrastructure providers and modules"
      - "make terraspace-ci-cd-infra-init"
      - "echo ## Getting Token from Secrets Manager"
      - ". ${CODEBUILD_SRC_DIR}/${SCRIPT_DIR}/sh/retrieve_token.sh"
      - "echo ## TERRASPACE UP : Bringing up the infrastructure"
      - "bash ${CODEBUILD_SRC_DIR}/${SCRIPT_DIR}/sh/restore_plan_artifacts.sh"
      - 'make terraspace-up-plan stack="ci-cd-infrastructure" plan="ci-cd-infrastructure.plan"'
      - 'make terraspace-up-plan stack="ci-cd-iam" plan="ci-cd-iam.plan"'
      - 'make terraspace-up-plan stack="website-iam" plan="website-iam.plan"'
      - 'make terraspace-up-plan stack="iam-groups" plan="iam-groups.plan"'
      - |
        # Read the just-applied output: an in-flight build retains its old env
        # during the initial migration, even after its project is updated.
        make terraspace-output-file stack="ci-cd-infrastructure" out=".ci-cd-infrastructure.env"
        pipeline_name=$(sed -n 's/^website_infra_pipeline_name = "\([^"]*\)"$/\1/p' "${CODEBUILD_SRC_DIR}/terraform/.ci-cd-infrastructure.env")
        test -n "$pipeline_name" || { echo "Missing website pipeline output" >&2; exit 1; }
        aws codepipeline start-pipeline-execution \
          --name "$pipeline_name" \
          --source-revisions "actionName=Download-Source,revisionType=COMMIT_ID,revisionValue=${CODEBUILD_RESOLVED_SOURCE_VERSION:?Missing source revision}"
    finally:
      - "mkdir -p ${CODEBUILD_SRC_DIR}/codepipeline-artifacts"
      - "printf 'up complete\n' > ${CODEBUILD_SRC_DIR}/codepipeline-artifacts/up.txt"

artifacts:
  files:
    - "codepipeline-artifacts/up.txt"

cache:
  paths:
    - "/bin"
    - "/usr/local/bin"
    - "/root/.terraform"
    - "/root/.cache"
    - "/root/.gem"
    - "/usr/local/bundle"
