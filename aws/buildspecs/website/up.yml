version: 0.2

phases:
  install:
    runtime-versions:
      python: $PYTHON_VERSION
      ruby: $RUBY_VERSION
    commands:
      - ". ${CODEBUILD_SRC_DIR}/${SCRIPT_DIR}/sh/credentials.sh"
      - "dnf install -y yum-utils"
      - "pip install python-dotenv"
      - ". ${CODEBUILD_SRC_DIR}/${SCRIPT_DIR}/sh/terraform_installation.sh"
  build:
    commands:
      - "cd ${CODEBUILD_SRC_DIR}"
      - "echo ## TERRASPACE UP : Bringing up the infrastructure"
      - 'if [ "$TS_ENV" = "test" ]; then python3 ${CODEBUILD_SRC_DIR}/${SCRIPT_DIR}/py/disassociate_waf.py; fi'
      - "bash ${CODEBUILD_SRC_DIR}/${SCRIPT_DIR}/sh/restore_plan_artifacts.sh"
      - 'make terraspace-up-plan stack="website" plan="website.plan"'
      - 'make terraspace-output-file stack="website" out=".terraform.env"'
      - "cd terraform"
      - "python3 ${CODEBUILD_SRC_DIR}/${SCRIPT_DIR}/py/distribution_deploy.py"
      - "echo Triggering CI-CD Website Pipeline"
      - |
        # Also tolerate an older in-flight run during the initial V2 migration;
        # never fall back to deploying scripts from a different source ref.
        for attempt in $(seq 1 60); do
          if result=$(aws codepipeline start-pipeline-execution \
            --name "$CI_CD_WEBSITE_PIPELINE_NAME" \
            --source-revisions "actionName=Download-Source,revisionType=COMMIT_ID,revisionValue=$CODEBUILD_RESOLVED_SOURCE_VERSION" 2>&1); then
            echo "$result"
            break
          fi
          echo "$result"
          if ! echo "$result" | grep -q "Source revisions can only be used with V2 pipelines" || [ "$attempt" -eq 60 ]; then
            exit 1
          fi
          sleep 15
        done
    finally:
      - "mkdir -p ${CODEBUILD_SRC_DIR}/codepipeline-artifacts"
      - "printf 'up complete\n' > ${CODEBUILD_SRC_DIR}/codepipeline-artifacts/up.txt"

artifacts:
  files:
    - "codepipeline-artifacts/up.txt"
cache:
  paths:
    - "/bin"
    - "/usr/local/bin"
    - "/root/.terraform"
    - "/root/.cache"
    - "/root/.gem"
    - "/usr/local/bundle"
