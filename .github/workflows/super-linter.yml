name: Static analysis and fixers

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  internal:
    if: >-
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.triggering_actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      checks: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate token with necessary permissions
        id: generate_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.VILNACRM_APP_ID }}
          private_key: ${{ secrets.VILNACRM_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0

      - name: Run Super-Linter
        uses: super-linter/super-linter@v7.1.0
        env:
          MULTI_STATUS: true
          VALIDATE_MARKDOWN: true
          VALIDATE_ENV: true
          VALIDATE_PYTHON_BLACK: true
          VALIDATE_PYTHON_FLAKE8: true
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_YAML: true
          VALIDATE_YAML_PRETTIER: true
          VALIDATE_MAKEFILE: true
          VALIDATE_TERRAFORM_FMT: true
          VALIDATE_BASH: true
          FIX_YAML_PRETTIER: true
          FIX_TERRAFORM_FMT: true
          FIX_PYTHON_BLACK: true
          FIX_MARKDOWN: true
          FIX_ENV: true
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          LINTER_RULES_PATH: .github/linters
          FILTER_REGEX_EXCLUDE: 'CHANGELOG\.md'

      - name: Commit and push linting fixes
        if: >
          github.event_name == 'pull_request' && github.ref_name !=
          github.event.repository.default_branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: ${{ github.event.pull_request.head.ref || github.head_ref ||
            github.ref }}
          commit_message: "chore(#${{ toJSON(github.event.number) }}): fix linting issues"
          commit_user_name: super-linter
          commit_user_email: super-linter@super-linter.dev
          token: ${{ steps.generate_token.outputs.token }}

  fork:
    if: >-
      github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code without push credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # No API status publishing or automatic fixes in unprivileged lanes.
      - name: Run Super-Linter read-only
        uses: super-linter/super-linter@v7.1.0
        env:
          MULTI_STATUS: false
          VALIDATE_MARKDOWN: true
          VALIDATE_ENV: true
          VALIDATE_PYTHON_BLACK: true
          VALIDATE_PYTHON_FLAKE8: true
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_YAML: true
          VALIDATE_YAML_PRETTIER: true
          VALIDATE_MAKEFILE: true
          VALIDATE_TERRAFORM_FMT: true
          VALIDATE_BASH: true
          FIX_YAML_PRETTIER: false
          FIX_TERRAFORM_FMT: false
          FIX_PYTHON_BLACK: false
          FIX_MARKDOWN: false
          FIX_ENV: false
          LINTER_RULES_PATH: .github/linters
          FILTER_REGEX_EXCLUDE: 'CHANGELOG\.md'

  dependabot:
    if: >-
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.actor == 'dependabot[bot]' ||
      github.triggering_actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code without push credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # No API status publishing or automatic fixes in unprivileged lanes.
      - name: Run Super-Linter read-only
        uses: super-linter/super-linter@v7.1.0
        env:
          MULTI_STATUS: false
          VALIDATE_MARKDOWN: true
          VALIDATE_ENV: true
          VALIDATE_PYTHON_BLACK: true
          VALIDATE_PYTHON_FLAKE8: true
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_YAML: true
          VALIDATE_YAML_PRETTIER: true
          VALIDATE_MAKEFILE: true
          VALIDATE_TERRAFORM_FMT: true
          VALIDATE_BASH: true
          FIX_YAML_PRETTIER: false
          FIX_TERRAFORM_FMT: false
          FIX_PYTHON_BLACK: false
          FIX_MARKDOWN: false
          FIX_ENV: false
          LINTER_RULES_PATH: .github/linters
          FILTER_REGEX_EXCLUDE: 'CHANGELOG\.md'

  # Keep the required check name; skipped/failed/cancelled work cannot pass.
  lint:
    if: ${{ always() }}
    needs: [internal, fork, dependabot]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the applicable lane to succeed
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          head, base = os.environ["HEAD_REPO"], os.environ["BASE_REPO"]
          if not head or not base:
              raise SystemExit("Missing PR repository identity")
          bot = "dependabot[bot]" in [
              os.environ["AUTHOR"],
              os.environ["ACTOR"],
              os.environ["TRIGGERING_ACTOR"],
          ]
          lane = "fork" if head != base else "dependabot" if bot else "internal"
          results = {
              key: value["result"]
              for key, value in json.loads(os.environ["RESULTS"]).items()
          }
          expected = {
              key: "success" if key == lane else "skipped"
              for key in ("internal", "fork", "dependabot")
          }
          if results != expected:
              raise SystemExit(f"Required {lane} lane did not succeed: {results}")
          print(f"Required {lane} lane succeeded")
          PY
